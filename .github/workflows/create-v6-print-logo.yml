name: One-off Category Cards print-logo derivative
on:
  push:
    branches: [qa/category-cards-v6-integration-20261021]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Derive transparent print legibility asset from unchanged official lockup
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Path('public/brand/prize-manager-logo-transparent-cropped.png')
          output=Path('public/brand/prize-manager-logo-print-contrast.png')
          image=Image.open(source).convert('RGBA')
          pixels=[]
          for r,g,b,a in image.getdata():
              if a and min(r,g,b)>145 and max(r,g,b)-min(r,g,b)<30:
                  pixels.append((48,52,56,a))
              else:
                  pixels.append((r,g,b,a))
          image.putdata(pixels)
          image=image.resize((360,102),Image.Resampling.LANCZOS)
          image.save(output,optimize=True)
          print('Print logo generated',image.size,image.mode,'bytes',output.stat().st_size)
          PY
      - name: Commit only print-specific derived PNG to this isolated QA branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/prize-manager-logo-print-contrast.png
          git diff --cached --quiet || (git commit -m 'test(qa): add transparent print contrast PNG [skip ci]' && git push origin HEAD:qa/category-cards-v6-integration-20261021)
