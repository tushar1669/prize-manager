name: Temporary Category v6 protected-route QA
on:
  push:
    branches: [qa/category-cards-v6-route-20261021]
permissions:
  contents: read
jobs:
  route-qa:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-jammy
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked QA dependencies
        run: npm ci --no-audit --fund=false
      - name: Build unchanged v6 app
        run: npm run build
      - name: Install A4 PDF validators
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils
      - name: Browser verify protected v6 route with synthetic session and mocked Supabase
        run: npx playwright test -c playwright.v6.route.qa.config.ts
      - name: Upload route QA PDF and trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category-v6-route-synthetic-qa
          path: |
            qa-output/
            test-results/
          if-no-files-found: ignore
