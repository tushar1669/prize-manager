name: Team XLSX with existing lock fix — isolated QA
on:
  push:
    branches:
      - qa/team-prizes-lockfile-isolation-20261025
  pull_request:
    branches:
      - feature/team-prizes-print-and-final-xlsx-20261024
jobs:
  targeted:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-jammy
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Verify exact locked install (PR 462)
        run: npm ci --no-audit --fund=false
      - name: Test team member exports and 4-sheet structure
        run: npx vitest run tests/utils/team-final-workbook.spec.ts tests/utils/final-prize-export.spec.ts
      - name: Run repository unit test suite
        run: npm run test:unit
      - name: Lint exact team export paths and the changed fixture
        run: npx eslint src/utils/teamPrizeExport.ts src/utils/finalPrizeWorkbook.ts tests/utils/team-final-workbook.spec.ts
      - name: Build application
        run: npm run build
      - name: Run public smoke E2E
        run: npm run test:smoke
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-lockfile-qa-playwright
          path: playwright-report
          if-no-files-found: ignore
