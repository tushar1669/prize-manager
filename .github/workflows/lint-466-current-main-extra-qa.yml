name: Lint 466 current-main independent regression QA (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  extra-regressions:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-jammy
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify strict locked dependency install
        run: npm ci --no-audit --fund=false
      - name: Typecheck application TypeScript project
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build application for Playwright preview webServer
        run: npm run build
      - name: Test Swiss-Manager import E2E
        run: npm run test:swiss
      - name: Test allocator null-safety E2E
        if: success() || failure()
        run: npm run test:alloc
      - name: Test UX improvements E2E
        if: success() || failure()
        run: npm run test:ux
      - name: Upload Playwright report for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-466-playwright-diagnostics
          path: playwright-report
          if-no-files-found: ignore
