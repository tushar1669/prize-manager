name: Branded XLSX isolated QA (temporary evidence only)
on:
  push:
    branches: [design/final-allocation-rca-xlsx-20261024]
  pull_request:
    branches: [chore/reconcile-npm-lock-20261021]
jobs:
  xlsx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install exact locked dependencies
        run: npm ci --no-audit --fund=false
      - name: Targeted XLSX contracts and style tests
        run: npx vitest run tests/utils/branded-workbook.spec.ts tests/utils/final-prize-export.spec.ts tests/utils/allocation-rca-export.spec.ts
      - name: Targeted lint
        run: npx eslint src/utils/excel.ts src/utils/brandedWorkbookXlsx.ts tests/utils/branded-workbook.spec.ts
      - name: Compile app
        run: npm run build
      - name: Inspect real XLSX style archive parts
        run: |
          test -f artifacts/branded-xlsx/final-winners.xlsx
          test -f artifacts/branded-xlsx/allocation-and-rca.xlsx
          unzip -p artifacts/branded-xlsx/final-winners.xlsx xl/styles.xml | grep -q "B38A32"
          unzip -p artifacts/branded-xlsx/allocation-and-rca.xlsx xl/styles.xml | grep -q "1F6E5B"
          unzip -p artifacts/branded-xlsx/allocation-and-rca.xlsx xl/styles.xml | grep -q "99571F"
      - name: Upload real XLSX fixture files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styled-xlsx-synthetic-fixtures
          path: artifacts/branded-xlsx/
          if-no-files-found: ignore
