name: Temporary Category Cards v6 integration QA
on:
  push:
    branches: [qa/category-cards-v6-integration-20261021]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-jammy
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install exact lockfile
        run: npm ci --no-audit --fund=false
      - name: Build actual app
        run: npm run build
      - name: Check required PDF inspection tools
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils && command -v pdftotext && command -v pdfinfo && command -v pdfimages
      - name: Run real Vite/React print and parity QA
        run: npx playwright test -c playwright.v6.qa.config.ts
      - name: Upload real React PDF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category-v6-real-react-a4-pdfs
          path: |
            qa-output/
            test-results/
          if-no-files-found: ignore
